name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render the page
        run: node scripts/render.mjs
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html styles.css CNAME .nojekyll agent-substrate-day.ics llms.txt _site/
          cp -R assets _site/assets
      - name: Refuse source identifiers
        run: |
          if grep -R -E -q -i 'spreadsheets/d/|sessionize\.com|BEGIN PRIVATE KEY|service_account' _site; then
            echo 'Public site contains a source identifier or credential.'
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
